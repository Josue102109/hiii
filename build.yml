name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar y Construir IPA
    runs-on: macos-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0' # O la versión que requiera tu proyecto

      - name: Descomprimir y Compilar
        run: |
          # 1. Si tu proyecto viene comprimido en un ZIP dentro del repo, descomprímelo:
          # unzip tu_proyecto.zip -d extracted_folder/
          
          # 2. Navega al directorio de tu proyecto si es necesario
          # cd extracted_folder/
          
          # 3. Ejemplo de comandos de compilación con xcodebuild (reemplaza con tu workspace/scheme):
          echo "Iniciando compilación de la IPA..."
          
          # Limpiar y crear directorio de build
          mkdir -p build/IPA
          
          # Nota: Para compilar un IPA real firmado, necesitarás configurar certificados y provisioning profiles, 
          # o usar herramientas auxiliares como fastlane.
